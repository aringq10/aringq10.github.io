name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gets the full history. jekyll-last-modified-at reads each
      # file's commit time from git; with the default shallow clone it finds no
      # history and falls back to file mtime, which in CI is checkout time - so
      # every build would stamp a fresh "modified" date.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v5

      # base_path is "" for a user site and "/REPO" for a project site; passing
      # it keeps relative_url correct either way without hardcoding baseurl in
      # _config.yml, which would break `jekyll serve`.
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      # Defaults to uploading _site.
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
