url: "https://aringas.dev" # the base hostname & protocol for your site
baseurl: "" # the subpath of your site, e.g. /blog

# Sidebar
title: "Aringas Civilka"
lang: "en"

footer_text:

# Sidebar theme picker. Each `id` must match a key in the $themes map in
# _sass/_variables.scss, which is where the colors live. Order is respected.
themes:
  - id: light
    label: Light
  - id: dark
    label: Dark
  - id: tokyonight
    label: Tokyo Night

# `icon` names a file in _includes/icons/.
socials:
  - name: aringq10
    icon: github
    url: "https://github.com/aringq10"
  - name: "aringas.benas.civilka@gmail.com"
    icon: email
    url: "mailto:aringas.benas.civilka@gmail.com"

# jekyll-seo-tag
description: "Software engineering student at Vilnius University. Notes and projects."
author: "Aringas Civilka"
social:
  name: "Aringas Civilka"
  links:
    - "https://github.com/aringq10"

plugins:
  - jekyll-target-blank
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-last-modified-at

collections:
  stuff:
    output: true
    permalink: /stuff/:title/

sass:
  style: expanded
  sourcemap: never

permalink: pretty

defaults:
  - scope:
      path: ""
      type: "stuff"
    values:
      layout: "stuff"
  - scope:
      path: ""
      type: "pages"
    values:
      nav_order: 100
  - scope:
      path: "assets"
    values:
      sitemap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
